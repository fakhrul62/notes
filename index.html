<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Note</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0e0e10;--sidebar:#18181b;--editor:#111113;--accent:#525252;--accent2:#737373;--text:#d4d4d8;--text2:#71717a;--border:#27272a;--hover:#222225;--danger:#dc2626}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text)}
#app{display:flex;height:100vh}

#sidebar{width:260px;min-width:260px;background:var(--sidebar);display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden;transition:width .2s,min-width .2s}
#sidebar.collapsed{width:0;min-width:0;border-right:none}
#sidebar-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
#sidebar-header h2{font-size:14px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
#new-page-btn{background:var(--accent);border:none;color:#fff;width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:background .15s}
#new-page-btn:hover{background:var(--accent2)}
#pages-list{flex:1;overflow-y:auto;padding:8px}
#pages-list::-webkit-scrollbar{width:4px}
#pages-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.page-item{padding:10px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:all .2s;margin-bottom:2px}
.page-item:hover{background:var(--hover)}
.page-item.active{background:var(--accent);color:#fff}
.page-item .page-title{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;outline:none;border:none;background:none;color:inherit}
.page-item .page-actions{display:flex;gap:4px;opacity:0;transition:opacity .12s}
.page-item:hover .page-actions,.page-item.active .page-actions{opacity:1}
.page-action-btn{background:none;border:none;color:var(--text2);cursor:pointer;width:22px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .12s}
.page-action-btn:hover{background:rgba(255,255,255,.1);color:var(--text)}
.page-action-btn.delete:hover{color:var(--danger)}
#editor-area{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--editor)}
#editor-area.reading-mode #editor-toolbar{display:none}
#editor-area.reading-mode #word-count{display:none!important}
#editor-area.reading-mode #sidebar{width:0;min-width:0;border-right:none}
#editor-area.reading-mode .page-item{display:none}
#editor-toolbar{padding:12px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;transition:opacity .2s}
.toolbar-btn{background:none;border:none;color:var(--text2);cursor:pointer;padding:6px 10px;border-radius:6px;font-size:13px;transition:all .12s;display:flex;align-items:center;gap:4px}
.toolbar-btn svg{pointer-events:none}
.toolbar-btn:hover{background:var(--hover);color:var(--text)}
.toolbar-btn.active{color:var(--accent2)}
.toolbar-sep{width:1px;height:16px;background:var(--border)}
.toolbar-spacer{flex:1}
#copy-btn{margin-left:auto}
.export-wrap{position:relative}
.export-dropdown{position:absolute;top:100%;right:0;margin-top:4px;background:var(--sidebar);border:1px solid var(--border);border-radius:8px;padding:4px;min-width:140px;display:none;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.export-dropdown.open{display:block}
.export-option{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--text2);transition:all .12s;border:none;background:none;width:100%;text-align:left}
.export-option:hover{background:var(--hover);color:var(--text)}
.editor-container{flex:1;display:flex;overflow:hidden;position:relative}
.editor-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.editor-panel+.editor-panel{border-left:1px solid var(--border)}
.editor-panel .panel-editor{flex:1;padding:40px 60px 100px;overflow-y:auto;font-size:15px;line-height:1.8;outline:none;min-height:100%;transition:opacity .15s}
.editor-panel .panel-editor::-webkit-scrollbar{width:6px}
.editor-panel .panel-editor::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.editor-panel .panel-editor:empty:before{content:attr(data-placeholder);color:var(--text2);pointer-events:none}
.editor-panel .panel-editor img{max-width:100%;border-radius:8px;margin:8px 0;cursor:pointer;transition:outline .1s}
.editor-panel .panel-editor img.selected{outline:2px solid var(--accent);outline-offset:2px}
.editor-panel .panel-editor h1{font-size:28px;font-weight:700;margin:8px 0}
.editor-panel .panel-editor h2{font-size:22px;font-weight:600;margin:6px 0}
.editor-panel .panel-editor h3{font-size:18px;font-weight:600;margin:4px 0}
.editor-panel .panel-editor blockquote{border-left:3px solid var(--accent);padding-left:16px;color:var(--text2);margin:8px 0}
.editor-panel .panel-editor ul,.editor-panel .panel-editor ol{padding-left:24px;margin:8px 0}
.editor-panel .panel-editor a{color:var(--accent2)}
.editor-panel .panel-editor hr{border:none;border-top:1px solid var(--border);margin:16px 0}
.editor-panel .panel-editor pre{background:#1a1a1e;border:1px solid var(--border);border-radius:6px;padding:12px 16px;margin:8px 0;overflow-x:auto;font-size:13px;line-height:1.5}
.editor-panel .panel-editor code{font-family:'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;background:#1a1a1e;padding:2px 5px;border-radius:4px;color:#e4e4e7}
.editor-panel .panel-editor pre code{background:none;padding:0;border-radius:0}
.panel-header{padding:8px 16px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text2);display:flex;align-items:center;gap:8px;background:var(--sidebar)}
.panel-header select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font-size:12px;outline:none;cursor:pointer}
.img-resize-handle{position:absolute;width:10px;height:10px;background:var(--accent);border:2px solid #fff;border-radius:50%;z-index:10;pointer-events:all}
.img-resize-overlay{position:absolute;pointer-events:none;z-index:9}
.img-resize-overlay.active{pointer-events:all}
.handle-tl{top:-5px;left:-5px;cursor:nwse-resize}
.handle-tc{top:-5px;left:50%;margin-left:-5px;cursor:ns-resize}
.handle-tr{top:-5px;right:-5px;cursor:nesw-resize}
.handle-ml{top:50%;margin-top:-5px;left:-5px;cursor:ew-resize}
.handle-mr{top:50%;margin-top:-5px;right:-5px;cursor:ew-resize}
.handle-bl{bottom:-5px;left:-5px;cursor:nesw-resize}
.handle-bc{bottom:-5px;left:50%;margin-left:-5px;cursor:ns-resize}
.handle-br{bottom:-5px;right:-5px;cursor:nwse-resize}
.img-size-label{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);background:#000;color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;white-space:nowrap;pointer-events:none}
#word-count{padding:10px 24px;border-top:1px solid var(--border);font-size:12px;color:var(--text2);display:flex;justify-content:space-between}
#empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text2)}
#empty-state .icon{font-size:48px;margin-bottom:16px;opacity:.3}
#empty-state p{font-size:14px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;transition:transform .3s ease;pointer-events:none;z-index:999}
#toast.show{transform:translateX(-50%) translateY(0)}
.search-box{padding:8px 12px;border-bottom:1px solid var(--border)}
#search-input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;font-size:12px;outline:none;transition:border-color .15s}
#search-input:focus{border-color:var(--accent)}
#search-input::placeholder{color:var(--text2)}
@media(max-width:768px){
  #sidebar{position:fixed;z-index:10;height:100%;width:260px;min-width:260px;transform:translateX(-100%);transition:transform .25s}
  #sidebar.open{transform:translateX(0)}
  #sidebar.collapsed{width:260px;min-width:260px}
  #mobile-toggle{display:flex!important}
  .editor-panel .panel-editor{padding:20px 16px 120px;font-size:15px}
  #editor-toolbar{padding:8px 12px;gap:4px;overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  #editor-toolbar::-webkit-scrollbar{display:none}
  .toolbar-btn{padding:8px 8px;min-width:36px;min-height:36px;font-size:12px}
  .toolbar-sep{margin:0 2px}
  #split-btn,#sound-btn{display:none!important}
  .pin-btn{width:36px;height:36px}
  .page-action-btn{width:36px;height:36px}
  .page-item .page-actions{opacity:1}
  .page-item.active .page-actions{opacity:1}
  #reading-overlay{padding:20px 16px;padding-top:env(safe-area-inset-top,20px)}
  #reading-overlay .reading-content{font-size:16px;line-height:1.8}
  #reading-overlay .reading-content h1{font-size:26px}
  #reading-overlay .reading-content h2{font-size:22px}
  #reading-overlay .reading-content h3{font-size:18px}
  #reading-exit{top:12px;right:12px;padding:10px 14px;font-size:12px}
  #word-count{padding:8px 16px;font-size:11px}
  .export-dropdown{right:-20px;min-width:130px}
  .theme-dropdown{right:-10px}
  .img-resize-handle{width:16px;height:16px}
  .handle-tl{top:-8px;left:-8px}
  .handle-tc{top:-8px;margin-left:-8px}
  .handle-tr{top:-8px;right:-8px}
  .handle-ml{margin-top:-8px;left:-8px}
  .handle-mr{margin-top:-8px;right:-8px}
  .handle-bl{bottom:-8px;left:-8px}
  .handle-bc{bottom:-8px;margin-left:-8px}
  .handle-br{bottom:-8px;right:-8px}
  #toast{bottom:calc(24px + env(safe-area-inset-bottom,0px));font-size:12px;padding:8px 16px}
  body{padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
}
#mobile-toggle{background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:6px;margin-right:8px}
#mobile-toggle:hover{background:var(--hover)}
#sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9}
.page-item.dragging{opacity:.4}
.page-item.drag-over{border-top:2px solid var(--accent2)}
.pin-btn{background:none;border:none;color:var(--text2);cursor:pointer;width:22px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .12s;flex-shrink:0}
.pin-btn:hover{background:rgba(255,255,255,.1);color:var(--text)}
.pin-btn.pinned{color:var(--accent2)}
.drop-overlay{position:absolute;inset:0;background:rgba(82,82,82,.15);border:2px dashed var(--accent2);border-radius:8px;display:none;align-items:center;justify-content:center;z-index:5;pointer-events:none;font-size:14px;color:var(--text2)}
.drop-overlay.visible{display:flex}
#save-indicator{width:8px;height:8px;border-radius:50%;background:var(--accent2);margin-left:8px;transition:all .2s;flex-shrink:0}
#save-indicator.saving{background:#eab308;animation:pulse .6s ease-in-out infinite}
#save-indicator.saved{background:#22c55e}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
.theme-wrap{position:relative}
.theme-dropdown{position:absolute;top:100%;right:0;margin-top:4px;background:var(--sidebar);border:1px solid var(--border);border-radius:8px;padding:8px;display:none;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.theme-dropdown.open{display:flex;gap:6px;flex-wrap:wrap;width:160px}
.theme-swatch{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .12s}
.theme-swatch:hover{transform:scale(1.15)}
.theme-swatch.active{border-color:var(--text)}
#reading-overlay{display:none;position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;padding:60px;flex-direction:column;align-items:center}
#reading-overlay.open{display:flex}
#reading-overlay .reading-content{max-width:680px;width:100%;font-size:18px;line-height:2;color:var(--text)}
#reading-overlay .reading-content h1{font-size:36px;font-weight:700;margin:16px 0 8px}
#reading-overlay .reading-content h2{font-size:28px;font-weight:600;margin:12px 0 6px}
#reading-overlay .reading-content h3{font-size:22px;font-weight:600;margin:8px 0 4px}
#reading-overlay .reading-content img{max-width:100%;border-radius:8px;margin:12px 0}
#reading-overlay .reading-content blockquote{border-left:3px solid var(--accent);padding-left:20px;color:var(--text2);margin:12px 0;font-style:italic}
#reading-overlay .reading-content pre{background:#1a1a1e;border:1px solid var(--border);border-radius:8px;padding:16px;margin:12px 0;overflow-x:auto;font-size:14px}
#reading-overlay .reading-content code{font-family:'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;background:#1a1a1e;padding:2px 6px;border-radius:4px}
#reading-overlay .reading-content pre code{background:none;padding:0}
#reading-exit{position:fixed;top:24px;right:24px;background:var(--hover);border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;z-index:51;transition:all .12s}
#reading-exit:hover{background:var(--border)}
.page-transition{animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar-overlay" onclick="toggleSidebar()"></div>
  <div id="sidebar">
    <div id="sidebar-header">
      <h2>Notes</h2>
      <button id="new-page-btn" onclick="createPage()" title="New page">+</button>
    </div>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search notes..." oninput="renderPages()">
    </div>
    <div id="pages-list"></div>
  </div>
  <div id="editor-area">
    <div id="editor-toolbar">
      <button id="mobile-toggle" onclick="toggleSidebar()">&#9776;</button>
      <button class="toolbar-btn" onclick="execCmd('bold')" title="Bold"><b>B</b></button>
      <button class="toolbar-btn" onclick="execCmd('italic')" title="Italic"><i>I</i></button>
      <button class="toolbar-btn" onclick="execCmd('underline')" title="Underline"><u>U</u></button>
      <div class="toolbar-sep"></div>
      <button class="toolbar-btn" onclick="execCmd('formatBlock','h1')" title="Heading 1">H1</button>
      <button class="toolbar-btn" onclick="execCmd('formatBlock','h2')" title="Heading 2">H2</button>
      <button class="toolbar-btn" onclick="execCmd('formatBlock','h3')" title="Heading 3">H3</button>
      <div class="toolbar-sep"></div>
      <button class="toolbar-btn" onclick="execCmd('insertUnorderedList')" title="Bullet list"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="6" y1="4" x2="14" y2="4"/><line x1="6" y1="8" x2="14" y2="8"/><line x1="6" y1="12" x2="14" y2="12"/><circle cx="2.5" cy="4" r="1" fill="currentColor" stroke="none"/><circle cx="2.5" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="2.5" cy="12" r="1" fill="currentColor" stroke="none"/></svg></button>
      <button class="toolbar-btn" onclick="execCmd('insertOrderedList')" title="Numbered list"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="7" y1="4" x2="14" y2="4"/><line x1="7" y1="8" x2="14" y2="8"/><line x1="7" y1="12" x2="14" y2="12"/><text x="1.5" y="5.5" font-size="5" fill="currentColor" stroke="none" font-family="sans-serif">1</text><text x="1.5" y="9.5" font-size="5" fill="currentColor" stroke="none" font-family="sans-serif">2</text><text x="1.5" y="13.5" font-size="5" fill="currentColor" stroke="none" font-family="sans-serif">3</text></svg></button>
      <button class="toolbar-btn" onclick="execCmd('formatBlock','blockquote')" title="Quote"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M3 3h4v4H5.5L4 9h2l1.5-2H9V3H3zm7 0h4v4h-1.5L11 9h2l1.5-2H16V3h-6z"/></svg></button>
      <div class="toolbar-sep"></div>
      <button class="toolbar-btn" onclick="execCmd('createLink',prompt('Enter URL:'))" title="Insert link"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6.5 9.5a3.5 3.5 0 0 0 5 0l2-2a3.5 3.5 0 0 0-5-5l-1 1"/><path d="M9.5 6.5a3.5 3.5 0 0 0-5 0l-2 2a3.5 3.5 0 0 0 5 5l1-1"/></svg></button>
      <button class="toolbar-btn" onclick="insertHR()" title="Horizontal rule"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="2" y1="8" x2="14" y2="8"/></svg></button>
      <button class="toolbar-btn" onclick="insertCode()" title="Code block"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 4 1 8 5 12"/><polyline points="11 4 15 8 11 12"/><line x1="9" y1="2" x2="7" y2="14"/></svg></button>
      <button class="toolbar-btn" onclick="clearFormatting()" title="Clear formatting (selection or full note)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 3.5h7"/><path d="M6 3.5v6"/><path d="M3.5 9.5l5 5"/><path d="M8.5 9.5l-5 5"/></svg></button>
      <div class="toolbar-sep"></div>
      <button class="toolbar-btn" id="split-btn" onclick="toggleSplit()" title="Split view"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="2" width="14" height="12" rx="2"/><line x1="8" y1="2" x2="8" y2="14"/></svg></button>
      <button class="toolbar-btn" id="sound-btn" onclick="toggleSound()" title="Sound effects"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 6v4h3l4 3V3L5 6H2z"/><path d="M11 5.5a3 3 0 0 1 0 5"/></svg></button>
      <button class="toolbar-btn" onclick="toggleReadingMode()" title="Reading mode"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 3h12v10H2z"/><path d="M6 3v10"/></svg></button>
      <div class="theme-wrap">
        <button class="toolbar-btn" onclick="toggleTheme()" title="Theme color"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="2" fill="currentColor"/></svg></button>
        <div class="theme-dropdown" id="theme-dropdown"></div>
      </div>
      <div id="save-indicator"></div>
      <button class="toolbar-btn" onclick="document.execCommand('undo')" title="Undo"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h7a4 4 0 0 1 0 8H7"/><polyline points="6 4 3 8 6 12"/></svg></button>
      <button class="toolbar-btn" onclick="document.execCommand('redo')" title="Redo"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8H6a4 4 0 0 0 0 8h3"/><polyline points="10 4 13 8 10 12"/></svg></button>
      <button id="copy-btn" class="toolbar-btn" onclick="copyNote()" title="Copy note"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M5 11H3.5A1.5 1.5 0 0 1 2 9.5v-7A1.5 1.5 0 0 1 3.5 1h7A1.5 1.5 0 0 1 12 2.5V5"/></svg><span id="copy-text">Copy</span></button>
      <div class="export-wrap">
        <button class="toolbar-btn" onclick="toggleExport()" title="Export"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12V4a1 1 0 0 1 1-1h6l4 4v5a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/><path d="M9 3v4h4"/></svg></button>
        <div class="export-dropdown" id="export-dropdown">
          <button class="export-option" onclick="exportNote('md')">Markdown (.md)</button>
          <button class="export-option" onclick="exportNote('txt')">Plain Text (.txt)</button>
          <button class="export-option" onclick="exportNote('html')">HTML (.html)</button>
        </div>
      </div>
    </div>
    <div class="editor-container" id="editor-container">
      <div class="editor-panel" id="panel-main">
        <div class="panel-header" id="panel-header-main" style="display:none"><span>Main</span></div>
        <div id="empty-state">
          <div class="icon">&#128221;</div>
          <p>Create a new note to get started</p>
        </div>
        <div class="panel-editor" id="editor" contenteditable="true" style="display:none" data-placeholder="Start typing or paste anything..."></div>
        <div class="drop-overlay" id="drop-overlay">Drop image here</div>
      </div>
      <div class="editor-panel" id="panel-split" style="display:none">
        <div class="panel-header" id="panel-header-split">
          <span>Also open:</span>
          <select id="split-select" onchange="switchSplitPage(this.value)"></select>
        </div>
        <div class="panel-editor" id="split-editor" contenteditable="true" data-placeholder="Select a note..."></div>
      </div>
    </div>
    <div id="word-count" style="display:none">
      <span id="char-count">0 characters</span>
      <span id="note-date"></span>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="reading-overlay">
  <button id="reading-exit" onclick="toggleReadingMode()">Esc to exit</button>
  <div class="reading-content" id="reading-content"></div>
</div>

<script>
let pages=[];
let activePageId=null;
let dragSrcId=null;
let splitMode=false;
let splitPageId=null;
let soundEnabled=false;
let audioCtx=null;

const THEMES=[
  {name:'Gray',accent:'#525252',accent2:'#737373'},
  {name:'Purple',accent:'#6d28d9',accent2:'#7c3aed'},
  {name:'Blue',accent:'#1d4ed8',accent2:'#3b82f6'},
  {name:'Green',accent:'#15803d',accent2:'#22c55e'},
  {name:'Red',accent:'#b91c1c',accent2:'#ef4444'},
  {name:'Orange',accent:'#c2410c',accent2:'#f97316'},
  {name:'Pink',accent:'#be185d',accent2:'#ec4899'},
  {name:'Teal',accent:'#0f766e',accent2:'#14b8a6'}
];

function load(){
  try{pages=JSON.parse(localStorage.getItem('notes_pages'))||[]}catch(e){pages=[]}
  pages.forEach(p=>{if(p.pinned===undefined)p.pinned=false});
  const sb=document.getElementById('sidebar');
  const sidebarState=localStorage.getItem('notes_sidebar');
  if(window.innerWidth>768){
    if(sidebarState!=='open')sb.classList.add('collapsed');
  }
  const savedTheme=localStorage.getItem('notes_theme');
  if(savedTheme)applyTheme(JSON.parse(savedTheme));
  soundEnabled=localStorage.getItem('notes_sound')==='true';
  updateSoundBtn();
  if(!pages.length)createPage(true);else{renderPages();selectPage(pages[0].id)}
}
function save(){localStorage.setItem('notes_pages',JSON.stringify(pages))}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}

function timeAgo(ts){
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return 'just now';
  const m=Math.floor(s/60);
  if(m<60)return m+'m ago';
  const h=Math.floor(m/60);
  if(h<24)return h+'h ago';
  const d=Math.floor(h/24);
  if(d<30)return d+'d ago';
  const mo=Math.floor(d/30);
  if(mo<12)return mo+'mo ago';
  return Math.floor(mo/12)+'y ago';
}

function playSound(type){
  if(!soundEnabled)return;
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.connect(gain);gain.connect(audioCtx.destination);
  gain.gain.value=0.05;
  if(type==='save'){osc.frequency.value=880;gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.08);osc.start();osc.stop(audioCtx.currentTime+0.08)}
  else if(type==='type'){osc.frequency.value=600;gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.03);osc.start();osc.stop(audioCtx.currentTime+0.03)}
  else if(type==='delete'){osc.frequency.value=200;gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.12);osc.start();osc.stop(audioCtx.currentTime+0.12)}
}

function createPage(first){
  const page={id:genId(),title:'Untitled',content:'',created:Date.now(),updated:Date.now(),pinned:false};
  pages.unshift(page);
  save();renderPages();selectPage(page.id);
  if(!first)toast('New note created');
}

function deletePage(id,e){
  e.stopPropagation();
  if(pages.length<=1){toast('Cannot delete last note');return}
  playSound('delete');
  pages=pages.filter(p=>p.id!==id);
  if(activePageId===id)selectPage(pages[0].id);
  if(splitPageId===id){splitPageId=null;document.getElementById('split-editor').innerHTML=''}
  save();renderPages();
}

function togglePin(id,e){
  e.stopPropagation();
  const page=pages.find(p=>p.id===id);
  if(!page)return;
  page.pinned=!page.pinned;
  save();renderPages();
}

function selectPage(id){
  activePageId=id;
  deselectImg();
  const page=pages.find(p=>p.id===id);
  if(!page)return;
  document.getElementById('empty-state').style.display='none';
  const editor=document.getElementById('editor');
  editor.style.display='block';
  document.getElementById('word-count').style.display='flex';
  editor.innerHTML=page.content;
  editor.classList.add('page-transition');
  setTimeout(()=>editor.classList.remove('page-transition'),200);
  editor.focus();
  const range=document.createRange();
  range.selectNodeContents(editor);
  range.collapse(false);
  const sel=window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  document.getElementById('note-date').textContent=timeAgo(page.updated);
  updateCount();
  renderPages();
  if(splitMode)updateSplitSelect();
  if(window.innerWidth<=768)toggleSidebar();
}

function renderPages(){
  const q=(document.getElementById('search-input').value||'').toLowerCase();
  const list=document.getElementById('pages-list');
  const filtered=pages.filter(p=>p.title.toLowerCase().includes(q)||p.content.toLowerCase().includes(q));
  const pinned=filtered.filter(p=>p.pinned);
  const unpinned=filtered.filter(p=>!p.pinned);
  const sorted=[...pinned,...unpinned];
  list.innerHTML=sorted.map(p=>`
    <div class="page-item ${p.id===activePageId?'active':''}" draggable="true" data-id="${p.id}" onclick="selectPage('${p.id}')" ondragstart="onDragStart(event)" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
      <button class="pin-btn ${p.pinned?'pinned':''}" onclick="togglePin('${p.id}',event)" title="${p.pinned?'Unpin':'Pin to top'}"><svg width="12" height="12" viewBox="0 0 16 16" fill="${p.pinned?'currentColor':'none'}" stroke="currentColor" stroke-width="1.5"><path d="M10 2L6 6l-3-1-2 2 3 3-4 4h3l4-4 3 3 2-2-1-3 4-4z"/></svg></button>
      <span class="page-title">${esc(p.title||'Untitled')}</span>
      <div class="page-actions">
        <button class="page-action-btn" onclick="renamePage('${p.id}',event)" title="Rename">&#9998;</button>
        <button class="page-action-btn delete" onclick="deletePage('${p.id}',event)" title="Delete">&#10005;</button>
      </div>
    </div>
  `).join('');
}

function onDragStart(e){
  dragSrcId=e.currentTarget.dataset.id;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
}
function onDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  e.currentTarget.classList.add('drag-over');
}
function onDragLeave(e){e.currentTarget.classList.remove('drag-over')}
function onDrop(e){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const targetId=e.currentTarget.dataset.id;
  if(!dragSrcId||dragSrcId===targetId)return;
  const srcIdx=pages.findIndex(p=>p.id===dragSrcId);
  const tgtIdx=pages.findIndex(p=>p.id===targetId);
  if(srcIdx<0||tgtIdx<0)return;
  const [moved]=pages.splice(srcIdx,1);
  pages.splice(tgtIdx,0,moved);
  save();renderPages();
  dragSrcId=null;
}

function renamePage(id,e){
  e.stopPropagation();
  const page=pages.find(p=>p.id===id);
  const name=prompt('Rename note:',page.title);
  if(name!==null&&name.trim()){page.title=name.trim();save();renderPages()}
}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

function execCmd(cmd,val){
  document.execCommand(cmd,false,val||null);
  document.getElementById('editor').focus();
  saveContent();
}

function stripFormattingHTML(html){
  const d=document.createElement('div');
  d.innerHTML=html;
  const blocks=Array.from(d.querySelectorAll('h1,h2,h3,h4,h5,h6,blockquote,pre,ul,ol,li,div'));
  for(let i=blocks.length-1;i>=0;i--){
    const el=blocks[i];
    if(!el.parentNode)continue;
    if(el.tagName==='UL'||el.tagName==='OL'){
      const frag=document.createDocumentFragment();
      while(el.firstChild)frag.appendChild(el.firstChild);
      el.replaceWith(frag);
    }else if(el.tagName==='PRE'){
      const p=document.createElement('p');
      while(el.firstChild)p.appendChild(el.firstChild);
      el.replaceWith(p);
      const texts=[];
      const w=document.createTreeWalker(p,NodeFilter.SHOW_TEXT);
      while(w.nextNode())texts.push(w.currentNode);
      texts.forEach(t=>{
        if(!t.nodeValue||t.nodeValue.indexOf('\n')<0)return;
        const parts=t.nodeValue.split('\n');
        const f=document.createDocumentFragment();
        parts.forEach((s,i)=>{
          if(i)f.appendChild(document.createElement('br'));
          if(s)f.appendChild(document.createTextNode(s));
        });
        t.replaceWith(f);
      });
    }else{
      const p=document.createElement('p');
      while(el.firstChild){
        const n=el.firstChild;
        if(n.nodeType===1&&(n.tagName==='P'||n.tagName==='DIV')){
          const hasContent=n.textContent.trim()||n.querySelector('img,hr');
          if(hasContent&&p.childNodes.length)p.appendChild(document.createElement('br'));
          while(n.firstChild)p.appendChild(n.firstChild);
          n.remove();
        }else p.appendChild(n);
      }
      el.replaceWith(p);
    }
  }
  d.querySelectorAll('a,b,strong,i,em,u,s,strike,del,ins,mark,small,sup,sub,font,span,code,tt,kbd,samp,center,abbr,cite,dfn,var,q').forEach(el=>{
    if(!el.parentNode)return;
    while(el.firstChild)el.parentNode.insertBefore(el.firstChild,el);
    el.parentNode.removeChild(el);
  });
  d.querySelectorAll('*').forEach(el=>{
    if(el.tagName==='IMG')return;
    ['style','class','color','face','size','align','dir','bgcolor','width','height','border'].forEach(a=>el.removeAttribute(a));
  });
  d.normalize();
  return d.innerHTML;
}

function coversContents(range,el){
  const c=document.createRange();
  c.selectNodeContents(el);
  return range.compareBoundaryPoints(Range.START_TO_START,c)<=0&&range.compareBoundaryPoints(Range.END_TO_END,c)>=0;
}

function tagToP(el,range){
  const p=document.createElement('p');
  const s={c:range.startContainer,o:range.startOffset};
  const e={c:range.endContainer,o:range.endOffset};
  while(el.firstChild){
    const n=el.firstChild;
    if(n.nodeType===1&&(n.tagName==='P'||n.tagName==='DIV')){
      const hasContent=n.textContent.trim()||n.querySelector('img,hr');
      if(hasContent&&p.childNodes.length)p.appendChild(document.createElement('br'));
      const k=p.childNodes.length;
      if(s.c===n){s.c=p;s.o=k+Math.min(s.o,n.childNodes.length)}
      if(e.c===n){e.c=p;e.o=k+Math.min(e.o,n.childNodes.length)}
      while(n.firstChild)p.appendChild(n.firstChild);
      n.remove();
    }else p.appendChild(n);
  }
  if(s.c===el){s.c=p;s.o=Math.min(s.o,p.childNodes.length)}
  if(e.c===el){e.c=p;e.o=Math.min(e.o,p.childNodes.length)}
  el.replaceWith(p);
  const maxOff=n=>n.nodeType===3?n.length:n.childNodes.length;
  range.setStart(s.c,Math.min(s.o,maxOff(s.c)));
  range.setEnd(e.c,Math.min(e.o,maxOff(e.c)));
}

function cleanRangeFormatting(range,root){
  document.execCommand('styleWithCSS',false,false);
  document.execCommand('removeFormat',false,null);
  document.execCommand('unlink',false,null);
  const sel=window.getSelection();
  const live=(sel.rangeCount&&root.contains(sel.getRangeAt(0).startContainer))?sel.getRangeAt(0):range;
  if(!root.contains(live.startContainer)||!root.contains(live.endContainer))return;
  root.querySelectorAll('span,font,code,[style],[class],[color],[face],[size],[align]').forEach(el=>{
    if(!el.parentNode||el.tagName==='IMG')return;
    if(!coversContents(live,el))return;
    if(el.tagName==='SPAN'||el.tagName==='FONT'||el.tagName==='CODE'){
      const parent=el.parentNode;
      const pi=Array.prototype.indexOf.call(parent.childNodes,el);
      const fixS=live.startContainer===el,fixE=live.endContainer===el;
      const so=live.startOffset,eo=live.endOffset;
      while(el.firstChild)parent.insertBefore(el.firstChild,el);
      parent.removeChild(el);
      if(fixS)live.setStart(parent,Math.min(pi+so,parent.childNodes.length));
      if(fixE)live.setEnd(parent,Math.min(pi+eo,parent.childNodes.length));
    }else{
      ['style','class','color','face','size','align','bgcolor'].forEach(a=>el.removeAttribute(a));
    }
  });
  const blocks=Array.from(root.querySelectorAll('h1,h2,h3,h4,h5,h6,blockquote'));
  for(let i=blocks.length-1;i>=0;i--){
    const el=blocks[i];
    if(el.parentNode&&live.intersectsNode(el))tagToP(el,live);
  }
  Array.from(root.querySelectorAll('pre')).forEach(pre=>{
    if(!pre.parentNode||!coversContents(live,pre))return;
    const parent=pre.parentNode;
    const idx=Array.prototype.indexOf.call(parent.childNodes,pre);
    const holder=document.createElement('div');
    holder.innerHTML=stripFormattingHTML(pre.innerHTML);
    const first=holder.firstChild;
    while(holder.firstChild)parent.insertBefore(holder.firstChild,pre);
    pre.remove();
    if(!root.contains(live.startContainer)||!root.contains(live.endContainer)){
      if(first)live.collapse(first,0);
      else if(root.contains(parent))live.collapse(parent,Math.min(idx,parent.childNodes.length));
    }
  });
}

function clearFormatting(){
  const sel=window.getSelection();
  const main=document.getElementById('editor');
  const split=document.getElementById('split-editor');
  if(!sel.rangeCount){toast('Click in the note first');return}
  const raw=sel.getRangeAt(0);
  let editor=null,range=null;
  [main,split].forEach(ed=>{
    if(ed.contains(raw.commonAncestorContainer)||raw.commonAncestorContainer===ed){
      if(!editor){editor=ed;range=raw}
    }
  });
  if(!editor){toast('Click in the note first');return}
  const fullDoc=range.collapsed||coversContents(range,editor);
  if(fullDoc){
    editor.innerHTML=stripFormattingHTML(editor.innerHTML);
    const end=document.createRange();
    end.selectNodeContents(editor);
    end.collapse(false);
    sel.removeAllRanges();
    sel.addRange(end);
  }else{
    cleanRangeFormatting(range,editor);
  }
  editor.focus();
  if(editor===split)saveSplitContent();
  else saveContent();
}

function insertHR(){document.execCommand('insertHorizontalRule');saveContent()}

function insertCode(){
  const sel=window.getSelection();
  if(!sel.rangeCount)return;
  const range=sel.getRangeAt(0);
  const selected=range.toString();
  if(selected){
    const pre=document.createElement('pre');
    const code=document.createElement('code');
    code.textContent=selected;
    pre.appendChild(code);
    range.deleteContents();
    range.insertNode(pre);
    const r2=document.createRange();
    r2.setStartAfter(pre);
    r2.collapse(true);
    sel.removeAllRanges();
    sel.addRange(r2);
  }else{
    document.execCommand('insertHTML',false,'<pre><code></code></pre>');
  }
  saveContent();
}

function copyNote(){
  const editor=document.getElementById('editor');
  const txt=editor.innerText||'';
  if(!txt.trim()){toast('Nothing to copy');return}
  navigator.clipboard.writeText(txt).then(()=>{
    const btn=document.getElementById('copy-text');
    btn.textContent='Copied!';
    setTimeout(()=>btn.textContent='Copy',1500);
  }).catch(()=>toast('Failed to copy'));
}

function toggleExport(){
  document.getElementById('export-dropdown').classList.toggle('open');
}

function exportNote(fmt){
  document.getElementById('export-dropdown').classList.remove('open');
  const page=pages.find(p=>p.id===activePageId);
  if(!page)return;
  const editor=document.getElementById('editor');
  const filename=(page.title||'note').replace(/[^a-z0-9]/gi,'_');
  let content,blob,ext;
  if(fmt==='txt'){
    content=editor.innerText||'';
    blob=new Blob([content],{type:'text/plain'});
    ext='txt';
  }else if(fmt==='html'){
    content='<!DOCTYPE html>\n<html><head><meta charset="UTF-8"><title>'+esc(page.title)+'</title><style>body{font-family:sans-serif;max-width:700px;margin:40px auto;padding:0 20px;line-height:1.7;color:#222}img{max-width:100%}pre{background:#f4f4f4;padding:12px;border-radius:6px;overflow-x:auto}blockquote{border-left:3px solid #ccc;padding-left:16px;color:#666}</style></head><body>\n'+editor.innerHTML+'\n</body></html>';
    blob=new Blob([content],{type:'text/html'});
    ext='html';
  }else{
    content=editor.innerText||'';
    blob=new Blob([content],{type:'text/markdown'});
    ext='md';
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename+'.'+ext;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Exported as '+ext.toUpperCase());
}

function showSaveIndicator(state){
  const el=document.getElementById('save-indicator');
  el.className='';
  if(state==='saving')el.className='saving';
  else if(state==='saved')el.className='saved';
}

let saveTimeout=null;
function saveContent(){
  if(!activePageId)return;
  const page=pages.find(p=>p.id===activePageId);
  if(!page)return;
  showSaveIndicator('saving');
  const editor=document.getElementById('editor');
  const txt=editor.innerText.trim();
  page.title=txt?txt.split('\n')[0].slice(0,60):'Untitled';
  page.content=editor.innerHTML;
  page.updated=Date.now();
  save();renderPages();updateCount();
  document.getElementById('note-date').textContent=timeAgo(page.updated);
  playSound('save');
  clearTimeout(saveTimeout);
  saveTimeout=setTimeout(()=>showSaveIndicator('saved'),400);
}

function saveSplitContent(){
  if(!splitPageId)return;
  const page=pages.find(p=>p.id===splitPageId);
  if(!page)return;
  showSaveIndicator('saving');
  const editor=document.getElementById('split-editor');
  page.content=editor.innerHTML;
  page.updated=Date.now();
  save();renderPages();
  clearTimeout(saveTimeout);
  saveTimeout=setTimeout(()=>showSaveIndicator('saved'),400);
}

function updateCount(){
  const editor=document.getElementById('editor');
  const txt=editor.innerText||'';
  const chars=txt.length;
  const words=txt.trim()?txt.trim().split(/\s+/).length:0;
  document.getElementById('char-count').textContent=`${words} words · ${chars} characters`;
}

let selectedImg=null;
let imgOverlay=null;
let resizeState=null;

function createImgOverlay(){
  if(imgOverlay)return;
  imgOverlay=document.createElement('div');
  imgOverlay.className='img-resize-overlay';
  const handles=['tl','tc','tr','ml','mr','bl','bc','br'];
  handles.forEach(h=>{
    const el=document.createElement('div');
    el.className='img-resize-handle handle-'+h;
    el.dataset.handle=h;
    imgOverlay.appendChild(el);
  });
  const label=document.createElement('div');
  label.className='img-size-label';
  label.id='img-size-label';
  imgOverlay.appendChild(label);
  document.body.appendChild(imgOverlay);
  imgOverlay.addEventListener('mousedown',e=>{
    const handle=e.target.dataset.handle;
    if(!handle||!selectedImg)return;
    e.preventDefault();
    e.stopPropagation();
    const r=selectedImg.getBoundingClientRect();
    resizeState={handle,startX:e.clientX,startY:e.clientY,startW:r.width,startH:r.height,aspect:r.width/r.height};
    document.addEventListener('mousemove',doResize);
    document.addEventListener('mouseup',stopResize);
  });
  imgOverlay.addEventListener('touchstart',e=>{
    const handle=e.target.dataset.handle;
    if(!handle||!selectedImg)return;
    e.preventDefault();
    e.stopPropagation();
    const t=e.touches[0];
    const r=selectedImg.getBoundingClientRect();
    resizeState={handle,startX:t.clientX,startY:t.clientY,startW:r.width,startH:r.height,aspect:r.width/r.height};
    document.addEventListener('touchmove',doTouchResize,{passive:false});
    document.addEventListener('touchend',stopTouchResize);
  },{passive:false});
}

function selectImg(img){
  deselectImg();
  selectedImg=img;
  img.classList.add('selected');
  createImgOverlay();
  imgOverlay.classList.add('active');
  positionOverlay();
}

function deselectImg(){
  if(selectedImg){selectedImg.classList.remove('selected');selectedImg=null}
  if(imgOverlay){imgOverlay.remove();imgOverlay=null}
}

function positionOverlay(){
  if(!selectedImg||!imgOverlay||!selectedImg.parentNode)return;
  const r=selectedImg.getBoundingClientRect();
  imgOverlay.style.position='fixed';
  imgOverlay.style.left=(r.left-5)+'px';
  imgOverlay.style.top=(r.top-5)+'px';
  imgOverlay.style.width=(r.width+10)+'px';
  imgOverlay.style.height=(r.height+10)+'px';
  const label=document.getElementById('img-size-label');
  if(label)label.textContent=Math.round(r.width)+' × '+Math.round(r.height);
}

function doResize(e){
  if(!resizeState||!selectedImg)return;
  const dx=e.clientX-resizeState.startX;
  const dy=e.clientY-resizeState.startY;
  let nw=resizeState.startW;
  let nh=resizeState.startH;
  const h=resizeState.handle;
  if(h.includes('r'))nw=resizeState.startW+dx;
  if(h.includes('l'))nw=resizeState.startW-dx;
  if(h.includes('b'))nh=resizeState.startH+dy;
  if(h.includes('t'))nh=resizeState.startH-dy;
  if(h==='tc'||h==='bc')nw=nh*resizeState.aspect;
  if(h==='ml'||h==='mr')nh=nw/resizeState.aspect;
  if(h==='tl'||h==='tr'||h==='bl'||h==='br'){
    if(Math.abs(dx)>Math.abs(dy))nh=nw/resizeState.aspect;else nw=nh*resizeState.aspect;
  }
  nw=Math.max(40,nw);nh=Math.max(40,nh);
  selectedImg.style.width=nw+'px';
  selectedImg.style.height=nh+'px';
  positionOverlay();
}

function stopResize(){
  resizeState=null;
  document.removeEventListener('mousemove',doResize);
  document.removeEventListener('mouseup',stopResize);
  saveContent();
}

function doTouchResize(e){
  if(!resizeState||!selectedImg)return;
  e.preventDefault();
  const t=e.touches[0];
  doResize({clientX:t.clientX,clientY:t.clientY});
}

function stopTouchResize(){
  resizeState=null;
  document.removeEventListener('touchmove',doTouchResize);
  document.removeEventListener('touchend',stopTouchResize);
  saveContent();
}

function insertImageFile(file){
  if(!file||!file.type.startsWith('image/'))return;
  const reader=new FileReader();
  reader.onload=function(ev){
    const img='<img src="'+ev.target.result+'" alt="dropped image">';
    document.execCommand('insertHTML',false,img);
    saveContent();
    toast('Image added — click to resize');
  };
  reader.readAsDataURL(file);
}

function handlePaste(e){
  const items=e.clipboardData&&e.clipboardData.items;
  if(!items)return;
  for(let i=0;i<items.length;i++){
    if(items[i].type.indexOf('image')!==-1){
      e.preventDefault();
      insertImageFile(items[i].getAsFile());
      return;
    }
  }
}

function handleDrop(e){
  e.preventDefault();
  document.getElementById('drop-overlay').classList.remove('visible');
  const files=e.dataTransfer&&e.dataTransfer.files;
  if(!files)return;
  for(let i=0;i<files.length;i++){
    if(files[i].type.startsWith('image/'))insertImageFile(files[i]);
  }
}

function handleDragOver(e){
  e.preventDefault();
  if(e.dataTransfer&&e.dataTransfer.types.indexOf('Files')!==-1){
    document.getElementById('drop-overlay').classList.add('visible');
  }
}

function handleDragLeave(e){
  if(!document.getElementById('editor-area').contains(e.relatedTarget)){
    document.getElementById('drop-overlay').classList.remove('visible');
  }
}

function toggleSidebar(){
  const sb=document.getElementById('sidebar');
  if(window.innerWidth<=768){
    sb.classList.toggle('open');
    document.getElementById('sidebar-overlay').style.display=
      sb.classList.contains('open')?'block':'none';
  }else{
    sb.classList.toggle('collapsed');
    localStorage.setItem('notes_sidebar',sb.classList.contains('collapsed')?'collapsed':'open');
  }
}

function toggleSplit(){
  if(window.innerWidth<=768){toast('Split view not available on mobile');return}
  splitMode=!splitMode;
  const panel=document.getElementById('panel-split');
  const btn=document.getElementById('split-btn');
  const mainHeader=document.getElementById('panel-header-main');
  if(splitMode){
    panel.style.display='flex';
    mainHeader.style.display='flex';
    btn.classList.add('active');
    updateSplitSelect();
    if(!splitPageId){
      const other=pages.find(p=>p.id!==activePageId);
      if(other){splitPageId=other.id;loadSplitPage()}
    }
  }else{
    panel.style.display='none';
    mainHeader.style.display='none';
    btn.classList.remove('active');
    splitPageId=null;
  }
}

function updateSplitSelect(){
  const sel=document.getElementById('split-select');
  sel.innerHTML=pages.filter(p=>p.id!==activePageId).map(p=>
    `<option value="${p.id}" ${p.id===splitPageId?'selected':''}>${esc(p.title||'Untitled')}</option>`
  ).join('');
  if(splitPageId&&!pages.find(p=>p.id===splitPageId)){
    const other=pages.find(p=>p.id!==activePageId);
    splitPageId=other?other.id:null;
  }
  if(splitPageId)loadSplitPage();
}

function switchSplitPage(id){
  splitPageId=id;
  loadSplitPage();
}

function loadSplitPage(){
  const page=pages.find(p=>p.id===splitPageId);
  if(!page)return;
  const editor=document.getElementById('split-editor');
  editor.innerHTML=page.content;
  editor.classList.add('page-transition');
  setTimeout(()=>editor.classList.remove('page-transition'),200);
}

function toggleSound(){
  soundEnabled=!soundEnabled;
  localStorage.setItem('notes_sound',soundEnabled);
  updateSoundBtn();
  if(soundEnabled)playSound('save');
  toast(soundEnabled?'Sound on':'Sound off');
}

function updateSoundBtn(){
  const btn=document.getElementById('sound-btn');
  if(soundEnabled){btn.classList.add('active')}
  else{btn.classList.remove('active')}
}

function toggleReadingMode(){
  const overlay=document.getElementById('reading-overlay');
  const editorArea=document.getElementById('editor-area');
  if(overlay.classList.contains('open')){
    overlay.classList.remove('open');
    editorArea.classList.remove('reading-mode');
  }else{
    const editor=document.getElementById('editor');
    document.getElementById('reading-content').innerHTML=editor.innerHTML;
    overlay.classList.add('open');
    editorArea.classList.add('reading-mode');
  }
}

function toggleTheme(){
  document.getElementById('theme-dropdown').classList.toggle('open');
}

function applyTheme(theme){
  document.documentElement.style.setProperty('--accent',theme.accent);
  document.documentElement.style.setProperty('--accent2',theme.accent2);
  localStorage.setItem('notes_theme',JSON.stringify(theme));
  document.querySelectorAll('.theme-swatch').forEach(s=>{
    s.classList.toggle('active',s.dataset.color===theme.accent);
  });
}

function initThemes(){
  const dd=document.getElementById('theme-dropdown');
  const saved=localStorage.getItem('notes_theme');
  const current=saved?JSON.parse(saved).accent:'#525252';
  dd.innerHTML=THEMES.map(t=>
    `<div class="theme-swatch ${t.accent===current?'active':''}" data-color="${t.accent}" style="background:${t.accent}" title="${t.name}" onclick="applyTheme(${JSON.stringify(t).replace(/"/g,'&quot;')})"></div>`
  ).join('');
}

document.addEventListener('DOMContentLoaded',()=>{
  load();
  initThemes();
  const editor=document.getElementById('editor');
  const editorArea=document.getElementById('editor-area');
  const editorContainer=document.getElementById('editor-container');
  editor.addEventListener('input',saveContent);
  editor.addEventListener('paste',handlePaste);
  editor.addEventListener('drop',handleDrop);
  editorArea.addEventListener('dragover',handleDragOver);
  editorArea.addEventListener('dragleave',handleDragLeave);
  editor.addEventListener('mousedown',e=>{
    if(e.target.tagName==='IMG'&&editor.contains(e.target)){
      e.preventDefault();
      selectImg(e.target);
    }
  });
  editor.addEventListener('touchstart',e=>{
    if(e.target.tagName==='IMG'&&editor.contains(e.target)){
      e.preventDefault();
      selectImg(e.target);
    }
  },{passive:false});
  document.addEventListener('mousedown',e=>{
    if(imgOverlay&&imgOverlay.classList.contains('active')&&imgOverlay.contains(e.target))return;
    if(e.target.tagName==='IMG'&&editor.contains(e.target))return;
    deselectImg();
  });
  document.addEventListener('touchstart',e=>{
    if(imgOverlay&&imgOverlay.classList.contains('active')&&imgOverlay.contains(e.target))return;
    if(e.target.tagName==='IMG'&&editor.contains(e.target))return;
    deselectImg();
  });
  editor.addEventListener('keydown',e=>{
    if(e.key==='Tab'){
      e.preventDefault();
      document.execCommand('insertText',false,'    ');
    }
    if(e.key==='Escape')deselectImg();
    if((e.key==='Delete'||e.key==='Backspace')&&selectedImg&&editor.contains(selectedImg)){
      e.preventDefault();
      const next=selectedImg.nextElementSibling||selectedImg.previousElementSibling;
      selectedImg.remove();
      deselectImg();
      saveContent();
      if(next&&next.nodeType===1){
        const range=document.createRange();
        range.setStart(next,0);
        range.collapse(true);
        const sel=window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
    }
  });

  if(splitMode){
    const splitEditor=document.getElementById('split-editor');
    splitEditor.addEventListener('input',saveSplitContent);
    splitEditor.addEventListener('paste',handlePaste);
    splitEditor.addEventListener('mousedown',e=>{
      if(e.target.tagName==='IMG'&&splitEditor.contains(e.target)){
        e.preventDefault();
        selectImg(e.target);
      }
    });
  }

  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key==='n'){e.preventDefault();createPage()}
    if((e.ctrlKey||e.metaKey)&&e.key==='\\'){e.preventDefault();toggleSplit()}
    if(e.key==='Escape'){
      const ro=document.getElementById('reading-overlay');
      if(ro.classList.contains('open'))toggleReadingMode();
    }
  });
  document.getElementById('search-input').addEventListener('keydown',e=>{
    if(e.key==='Escape'){e.target.value='';renderPages()}
  });
  window.addEventListener('scroll',positionOverlay,true);
  window.addEventListener('resize',positionOverlay);
  document.addEventListener('click',e=>{
    if(!e.target.closest('.export-wrap'))document.getElementById('export-dropdown').classList.remove('open');
    if(!e.target.closest('.theme-wrap'))document.getElementById('theme-dropdown').classList.remove('open');
  });
  setInterval(()=>{
    const el=document.getElementById('note-date');
    const page=pages.find(p=>p.id===activePageId);
    if(el&&page)el.textContent=timeAgo(page.updated);
  },30000);
});
</script>
</body>
</html>
